name: Log project field changes

on:
  # GitHub Actions requires a literal cron expression here (no variables/expressions
  # allowed), so to change the interval later just edit this line directly.
  # 5 min is for testing; '0 * * * *' (hourly) is a reasonable steady-state value.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  track-project-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Snapshot of the last-seen field values, kept in the Actions cache (not git)
      # so runs have no commit footprint at all. Keyed per run so save never
      # collides; restore-keys grabs the most recent prior entry.
      - name: Restore previous project snapshot
        uses: actions/cache/restore@v4
        with:
          path: .github/project-state
          key: project-2-snapshot-${{ github.run_id }}
          restore-keys: |
            project-2-snapshot-

      - name: Detect field changes and comment on linked issues/PRs
        id: track
        uses: actions/github-script@v7
        env:
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const track = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/track-project-field-changes.js`);
            await track({ github, context, core });

      - name: Save project snapshot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/project-state
          key: project-2-snapshot-${{ github.run_id }}
